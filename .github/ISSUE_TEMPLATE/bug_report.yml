name: Bug report
description: Report unexpected behavior using synthetic data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Do not upload private scan results, filenames, process arguments or tokens. Use SECURITY.md for sensitive vulnerabilities."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and execution environment
      description: "For example native Windows 11, macOS, WSL, container, or Crostini. No device IDs."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction and observed result
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result and coverage status
    validations:
      required: true
