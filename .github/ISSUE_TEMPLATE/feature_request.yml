name: Feature request
description: Propose a focused improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the situation and intended result without personal reports.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include platform scope, evidence needs and read-only boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing workflows or alternatives
