name: Prepare release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - run: go test -race ./...
  artifacts:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build reproducible archives
        shell: bash
        run: |
          mkdir -p dist
          VERSION="$(go run ./cmd/agent-doctor version)"
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0
            name="agent-doctor-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "dist/$name"
            executable=agent-doctor
            if [ "$GOOS" = windows ]; then executable=agent-doctor.exe; fi
            go build -trimpath -buildvcs=false -ldflags='-s -w' -o "dist/$name/$executable" ./cmd/agent-doctor
            cp LICENSE NOTICE.md THIRD_PARTY_NOTICES.md "dist/$name/"
            cp "$(go env GOROOT)/LICENSE" "dist/$name/GO-LICENSE"
            cp "$(go env GOROOT)/PATENTS" "dist/$name/GO-PATENTS"
            tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -C dist -cf - "$name" | gzip -n > "dist/$name.tar.gz"
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agent-doctor-release-artifacts
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
